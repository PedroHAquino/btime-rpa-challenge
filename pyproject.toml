[tool.poetry]
name = "btime-rpa-challenge"
version = "0.1.0"
description = ""
authors = ["Pedro Seu Sobrenome <aquinopedro36@gmail.com>"]
readme = "README.md"
packages = [{ include = "btime_rpa", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
requests = "^2.34.2"
beautifulsoup4 = "^4.15.0"
lxml = "^6.1.3"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.17.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88